server.port=8082
spring.application.name=thunai-order-service
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/thunai}
spring.datasource.username=${DATABASE_USERNAME:thunai}
spring.datasource.password=${DATABASE_PASSWORD:thunai}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.service-name=thunai-order-service
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
